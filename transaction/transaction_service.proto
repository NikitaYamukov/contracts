syntax = "proto3";

package transaction;

option go_package = "github.com/NikitaYamukov/contracts/transaction/go;transaction";

import "google/protobuf/timestamp.proto";
import "transaction_model.proto";
import "pagination/pagination.proto";

service TransactionService {
  rpc Deposit(DepositRequest) returns (TransactionDetails);
  rpc Withdraw(WithdrawRequest) returns (TransactionDetails);
  rpc Transfer(TransferRequest) returns (TransactionDetails);
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
}

message DepositRequest {
  uint64 user_id = 1;
  double amount = 2;
}

message WithdrawRequest {
  uint64 account_id = 1;
  double amount = 2;
}

message TransferRequest {
  uint64 user_id = 1;
  double amount = 2;
  uint64 recipient = 3;
}

message GetTransactionsRequest {
  optional uint64 user_id = 1;
  optional string type = 2;
  optional string status = 3;
  optional google.protobuf.Timestamp date_from = 4; // filter from date
  optional google.protobuf.Timestamp date_to = 5; // filter to date
  optional pagination.Pagination pagination = 6;
}

message GetTransactionsResponse {
  repeated TransactionDetails transactions = 1;
  pagination.Pagination pagination = 2;
}

syntax = "proto3";

package transaction;

option go_package = "github.com/NikitaYamukov/contracts/transaction/go;transaction";

import "google/protobuf/timestamp.proto";

message Transaction {
  uint64 id = 1;
  uint64 user_id = 2;
  double amount = 3;
  string status = 4; // pending | completed | failed
  string type = 5; // deposit | withdraw | transfer
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TransactionEntry {
  uint64 id = 1;
  uint64 transaction_id = 2;
  uint64 account_id = 3;
  string direction = 4; // DEBIT | CREDIT
  double amount = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TransactionDetails {
  Transaction transaction = 1;
  repeated TransactionEntry entries = 2;
}
